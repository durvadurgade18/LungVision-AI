<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LungVision AI</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <!-- Animated Background -->
    <div class="background"></div>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <img src="{{ url_for('static', filename='images/logo/logo.png') }}"alt="Logo">

            <h2>LungVision <span>AI</span></h2>

        </div>

        

        

    </header>

    <!-- ================= LOGIN SECTION ================= -->

    <section class="login-section">

        <!-- LEFT SIDE -->

        <div class="login-card">

            <small>WELCOME BACK</small>

            <h1>

                Sign in to
                <span>LungVision AI</span>

            </h1>

            <p>

                AI Powered Lung Disease Detection System

            </p>

            <form id="loginForm" method="POST" action="/login">

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required>

        <i class="fa-solid fa-eye togglePassword"></i>
    </div>

    <div class="options">
        <label>
            <input type="checkbox">
            Remember Me
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <button type="submit" class="login-btn">
        Login
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</form>

            <div class="divider">

                <span>OR</span>

            </div>

           

            <p class="register">

    Don't have an account?

    <a href="/register">

        Register

    </a>

</p>

        </div>

        <!-- RIGHT SIDE -->

        <div class="hero-image">

           <img src="{{ url_for('static', filename='images/illustrations/hero-lungs.png') }}" alt="Lungs">

            <div class="circle one"></div>
            <div class="circle two"></div>

        </div>

    </section>

   <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
